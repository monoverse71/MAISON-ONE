<title>Apon Niketon Holdings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Noto+Sans+Bengali:wght@400;600&display=swap">
<style>
/* Layout concept: fixed left rail + top identity bar; content is dense, ruled tables on white panels over a cool grey ground.
   Purple is reserved for identity, primary actions and share-side money; teal marks construction money in, orange marks money out. */
:root{
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#1F2937; --ink-2:#4B5563; --ink-3:#6B7280; --line:#E5E7EB; --line-2:#D1D5DB;
  --primary:#6B21A8; --primary-2:#5B21B6; --primary-text:#6B21A8; --primary-soft:#F5EEFB; --btn:#6B21A8; --btn-hover:#5B21B6; --btn-fg:#FFFFFF;
  --ok:#15803D; --ok-bg:#DCFCE7; --warn:#B45309; --warn-bg:#FEF3C7; --bad:#B91C1C; --bad-bg:#FEE2E2; --info:#5B21B6; --info-bg:#EDE9FE; --mute:#4B5563; --mute-bg:#F3F4F6;
  --s-share:#6B21A8; --s-cons:#1BAF7A; --s-out:#EB6834; --s-recv:#9CA3AF;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 1px 3px rgba(17,24,39,.05); --shadow-pop:0 10px 30px rgba(17,24,39,.14),0 2px 6px rgba(17,24,39,.08);
  --overlay:rgba(17,24,39,.45); --side-bg:#FFFFFF; --side-active:#F5EEFB;
  --font-body:'IBM Plex Sans','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Newsreader','Noto Serif Bengali',Georgia,serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131017; --surface:#1B1722; --surface-2:#241F2D; --ink:#EDEAF2; --ink-2:#BDB7C9; --ink-3:#8F889D; --line:#2E2839; --line-2:#3B3448;
    --primary:#C084FC; --primary-2:#A78BFA; --primary-text:#D8B4FE; --primary-soft:#2A1B3D; --btn:#7E22CE; --btn-hover:#6B21A8; --btn-fg:#FFFFFF;
    --ok:#4ADE80; --ok-bg:#12301D; --warn:#FBBF24; --warn-bg:#3A2A0B; --bad:#F87171; --bad-bg:#3B1416; --info:#C4B5FD; --info-bg:#2B2250; --mute:#BDB7C9; --mute-bg:#2A2533;
    --s-share:#A855F7; --s-cons:#199E70; --s-out:#D95926; --s-recv:#6B6478;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-pop:0 10px 30px rgba(0,0,0,.5); --overlay:rgba(0,0,0,.6); --side-bg:#1B1722; --side-active:#2A1B3D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131017; --surface:#1B1722; --surface-2:#241F2D; --ink:#EDEAF2; --ink-2:#BDB7C9; --ink-3:#8F889D; --line:#2E2839; --line-2:#3B3448;
  --primary:#C084FC; --primary-2:#A78BFA; --primary-text:#D8B4FE; --primary-soft:#2A1B3D; --btn:#7E22CE; --btn-hover:#6B21A8; --btn-fg:#FFFFFF;
  --ok:#4ADE80; --ok-bg:#12301D; --warn:#FBBF24; --warn-bg:#3A2A0B; --bad:#F87171; --bad-bg:#3B1416; --info:#C4B5FD; --info-bg:#2B2250; --mute:#BDB7C9; --mute-bg:#2A2533;
  --s-share:#A855F7; --s-cons:#199E70; --s-out:#D95926; --s-recv:#6B6478;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-pop:0 10px 30px rgba(0,0,0,.5); --overlay:rgba(0,0,0,.6); --side-bg:#1B1722; --side-active:#2A1B3D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--primary-text)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:12.5px;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.side{background:var(--side-bg);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow-y:auto}
.brand{padding:4px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand-co{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:.1px;color:var(--ink);line-height:1.15}
.brand-sys{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;background:none;border-radius:6px;text-align:left;color:var(--ink-2);font-weight:500;width:100%}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--side-active);color:var(--primary-text)}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;color:var(--ink-3)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 24px;min-height:58px}
.proj{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.proj small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.proj b{font-family:var(--font-display);font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsearch{position:relative;flex:1;max-width:460px;margin-left:auto}
.top-r{display:flex;gap:10px;align-items:center}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl i{width:9px;height:9px;border-radius:50%;background:var(--primary);margin-top:6px}
.floor{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 12px;align-items:center}
.ucell{display:inline-flex;flex-direction:column;gap:1px;min-width:92px;padding:7px 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);text-align:left}
.ucell:hover{border-color:var(--primary)}
.ucell b{font-size:13px}.ucell span{font-size:11px;color:var(--ink-3)}
.ucell.s-Available{border-style:dashed}.ucell.s-Reserved{background:var(--warn-bg)}.ucell.s-Assigned{background:var(--info-bg)}.ucell.s-Under{background:var(--primary-soft)}.ucell.s-Completed{background:var(--ok-bg)}.ucell.s-Handed{background:var(--mute-bg)}
.rep-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.rep-grid .nav button{align-items:flex-start;text-align:left}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.kv span:first-child{color:var(--ink-3)}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg)}
.gsearch .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.pop{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-pop);z-index:60;min-width:260px;max-height:70vh;overflow:auto}
.pop-fixed{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-pop);min-width:200px;padding:4px}
.pop-h{padding:8px 12px 4px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pop-i{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:6px}
.pop-i:hover{background:var(--surface-2)}
.pop-i.danger{color:var(--bad)}
.icon-btn{position:relative;display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;font-weight:600}
.user-btn{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px 3px 4px}
.content{padding:24px;width:100%;max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.ph p{color:var(--ink-3);margin-top:4px;max-width:70ch}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.demo-tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:4px;white-space:nowrap}
.bottom-nav{display:none}
.menu-btn{display:none}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2,.card-h h3{font-size:14px;font-weight:600}
.card-h small{color:var(--ink-3);font-size:12px}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;white-space:nowrap;line-height:1.25}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--btn);border-color:var(--btn);color:var(--btn-fg)}
.btn-primary:hover:not(:disabled){background:var(--btn-hover)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-danger.solid{background:var(--bad);color:#fff}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn-ghost{border-color:transparent;background:none;color:var(--primary-text)}
.btn-ghost:hover:not(:disabled){background:var(--primary-soft)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.t-ok{color:var(--ok);background:var(--ok-bg)}.t-warn{color:var(--warn);background:var(--warn-bg)}.t-bad{color:var(--bad);background:var(--bad-bg)}.t-info{color:var(--info);background:var(--info-bg)}.t-mute{color:var(--mute);background:var(--mute-bg)}
.pill{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pill-in{color:var(--ok);background:var(--ok-bg)}.pill-out{color:var(--warn);background:var(--warn-bg)}.pill-net{color:var(--info);background:var(--info-bg)}.pill-share{color:var(--primary-text);background:var(--primary-soft)}.pill-cons{color:var(--ok);background:var(--ok-bg)}
.avatar{display:grid;place-items:center;border-radius:50%;background:var(--primary-soft);color:var(--primary-text);font-weight:600;flex:none}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat-l{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.stat-v{font-size:22px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat-s{font-size:12px;color:var(--ink-3)}
.sect-t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--ink-2)}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-text);border-color:var(--primary)}
.chip-sep{width:1px;height:18px;background:var(--line-2);margin:0 4px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input{width:100%;padding:7px 10px 7px 32px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)}
.search .ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--ink-3);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--primary-text);border-bottom-color:var(--primary)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;color:var(--ink-2);font-weight:500}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-text)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:600;background:var(--surface-2)}
.tbl .strike td{color:var(--ink-3);text-decoration:line-through}
.tbl .strike td .badge,.tbl .strike td .btn,.tbl .strike td .pop-i{text-decoration:none}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px;gap:10px;flex-wrap:wrap}
.cell-name{display:flex;align-items:center;gap:10px;min-width:180px}
.cell-name b{font-weight:600;display:block;line-height:1.25}
.cell-name span{font-size:12px;color:var(--ink-3)}
.link{background:none;border:0;padding:0;color:var(--primary-text);text-align:left;font-weight:500}
.link:hover{text-decoration:underline}
.act{display:flex;gap:6px;align-items:center;justify-content:flex-end}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .req{color:var(--bad)}
.inp{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);min-height:37px}
.inp:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary)}
.inp[aria-invalid="true"]{border-color:var(--bad)}
.inp:disabled{background:var(--surface-2);color:var(--ink-3)}
textarea.inp{min-height:68px;resize:vertical}
.err{color:var(--bad);font-size:12px}
.hint{color:var(--ink-3);font-size:12px}
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.frm .full{grid-column:1/-1}
.frm-t{grid-column:1/-1;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.frm-t:first-child{border-top:0;margin-top:0;padding-top:0}
.money{position:relative}
.money>span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.money .inp{padding-left:24px;font-variant-numeric:tabular-nums}
.sumbox{display:flex;flex-direction:column;gap:0}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sumrow:last-child{border-bottom:0}
.sumrow.big{font-weight:600;font-size:16px}
.sumrow span:first-child{color:var(--ink-2)}
.note{padding:10px 12px;border-radius:6px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
.note svg{flex:none;margin-top:2px}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:9px 14px;margin:0}
.dl dt{color:var(--ink-3);font-size:12.5px}.dl dd{margin:0;overflow-wrap:anywhere}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty b{color:var(--ink);font-size:14px}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px}
@keyframes sk{to{background-position:-200% 0}}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* modal / toast */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow-pop);width:100%;max-width:640px;display:flex;flex-direction:column;margin:auto 0}
.modal.wide{max-width:860px}.modal.narrow{max-width:460px}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-family:var(--font-display);font-size:20px;font-weight:600}
.modal-b{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:6px;box-shadow:var(--shadow-pop);padding:11px 14px;display:flex;gap:10px;align-items:flex-start}
.toast.success{border-left-color:var(--ok)}.toast.error{border-left-color:var(--bad)}.toast.info{border-left-color:var(--primary)}
.toast b{display:block}.toast span{color:var(--ink-3);font-size:12.5px}
.receipt{border:1px dashed var(--line-2);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px}

/* charts */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart-wrap{position:relative}
.chart-tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:var(--shadow-pop);padding:8px 10px;font-size:12px;z-index:5;min-width:170px;transform:translateX(-50%)}
.chart-tip div{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:13px}
.hb .track{height:10px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hb .track i{display:block;height:100%;border-radius:0 3px 3px 0}
.io-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
